services:
  - type: web
    name: agentops-api
    runtime: python
    buildCommand: pip install -r services/api/requirements.txt
    startCommand: uvicorn agentops_api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONPATH
        value: services/api:packages/python-sdk
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./agentops.db
    healthCheckPath: /health/live
